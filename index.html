<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Grid Landing Page</title>
  </head>
  <body>
    <div id="app">
      <!-- Temporary harness for previewing the stats component on its own.
           The real Statistics Container from the design replaces this. -->
      <div class="stats-preview">
        <article class="stat-card">
          <div class="stat-card__header">
            <img
              class="stat-card__icon"
              src="/icons/stat-students.svg"
              alt=""
              width="32"
              height="32"
            />
            <p class="stat-card__value">2.4M</p>
          </div>
          <div class="stat-card__description">
            <h2 class="stat-card__title">Students reached</h2>
            <p class="stat-card__detail">Across 31 countries since 2011.</p>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-card__header">
            <img
              class="stat-card__icon"
              src="/icons/stat-schools.svg"
              alt=""
              width="32"
              height="32"
            />
            <p class="stat-card__value">1,284</p>
          </div>
          <div class="stat-card__description">
            <h2 class="stat-card__title">Schools partnered</h2>
            <p class="stat-card__detail">In 14 countries, from Kenya to Guatemala.</p>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-card__header">
            <img
              class="stat-card__icon"
              src="/icons/stat-teachers.svg"
              alt=""
              width="32"
              height="32"
            />
            <p class="stat-card__value">38K</p>
          </div>
          <div class="stat-card__description">
            <h2 class="stat-card__title">Teachers trained</h2>
            <p class="stat-card__detail">Equipped with modern tools and methodology.</p>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-card__header">
            <img
              class="stat-card__icon"
              src="/icons/stat-graduation.svg"
              alt=""
              width="32"
              height="32"
            />
            <p class="stat-card__value">3.1×</p>
          </div>
          <div class="stat-card__description">
            <h2 class="stat-card__title">Graduation lift</h2>
            <p class="stat-card__detail">Partner schools outperform national averages 3x.</p>
          </div>
        </article>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
